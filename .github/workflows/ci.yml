name: Friberg Race Lite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [feature/autoplay-097]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          $files = @(
            'solver.js',
            'live-dom-adapter.js',
            'extension/feedback-parser-patch.js',
            'extension/race-policy.js',
            'extension/race-controller.js',
            'tools/repository-security-audit.js'
          )
          foreach ($file in $files) {
            Write-Host "Checking $file"
            node --check $file
          }

      - name: Validate manifest and 646-player pool
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('extension/manifest.json','utf8').replace(/^\uFEFF/,'')); const pool=JSON.parse(fs.readFileSync('data/players.game-646.json','utf8')); if(pool.length!==646) throw new Error('Expected 646 players, got '+pool.length); console.log('PASS: race manifest and 646-player pool');"

      - name: Run strict solver regression
        run: node tests/run-regression.js

      - name: Run race-lite contract and 646-answer simulation
        run: node tests/run-race-lite-contract.js

      - name: Repository security audit
        run: node tools/repository-security-audit.js

      - name: Build race extension
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\package-edge-extension.ps1

      - name: Validate delivery ZIP
        run: node tests/run-delivery-contract.js

      - name: Upload race extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: friberg-race-lite-${{ github.sha }}
          path: |
            dist/friberg-assistant-extension/
            dist/friberg-assistant-extension.zip
          if-no-files-found: error
          retention-days: 14
