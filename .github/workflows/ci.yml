name: Friberg Ultimate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [feature/autoplay-097]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          $files = @(
            'solver.js',
            'automation-core.js',
            'extension/background.js',
            'extension/ultimate-policy.js',
            'extension/ultimate-dom.js',
            'extension/ultimate-ui.js',
            'extension/ultimate-controller.js',
            'tools/repository-security-audit.js'
          )
          foreach ($file in $files) {
            Write-Host "Checking $file"
            node --check $file
          }

      - name: Validate Ultimate manifest and 646-player pool
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('extension/manifest.json','utf8').replace(/^\uFEFF/,'')); if(manifest.version!=='1.1.0') throw new Error('Expected Ultimate 1.1.0'); const pool=JSON.parse(fs.readFileSync('data/players.game-646.json','utf8')); if(pool.length!==646) throw new Error('Expected 646 players, got '+pool.length); console.log('PASS: Ultimate manifest and 646-player pool');"

      - name: Run strict solver regression
        run: node tests/run-regression.js

      - name: Run automation core contract
        run: node tests/run-automation-core.js

      - name: Run Ultimate architecture and all-answer contract
        run: node tests/run-ultimate-contract.js

      - name: Repository security audit
        run: node tools/repository-security-audit.js

      - name: Build Ultimate extension
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\package-edge-extension.ps1

      - name: Validate Ultimate delivery ZIP
        run: node tests/run-delivery-contract.js

      - name: Upload Ultimate artifact
        uses: actions/upload-artifact@v4
        with:
          name: friberg-ultimate-${{ github.sha }}
          path: |
            dist/friberg-assistant-extension/
            dist/friberg-assistant-extension.zip
          if-no-files-found: error
          retention-days: 14
